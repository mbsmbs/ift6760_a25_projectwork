defaults:
  - base

_target_: gflownet.envs.conformers.conformer.Conformer

# ==========================================
# 1. MOLECULE DEFINITION
# ==========================================
# Active molecule: Ibuprofen
smiles: 'CC(C)Cc1ccc(cc1)[C@@H](C)C(=O)O'

# WARNING: The lists below (flex_bond_*) are HARDCODED for Ibuprofen indices.
# If you change the SMILES above, you MUST update the indices below.

# ==========================================
# 2. INTERNAL COORDINATES (The Physics)
# ==========================================

# Torsions: -1 means "Auto-detect all rotatable bonds"
n_torsion_angles: -1

# Flexible Bond Lengths: [Atom1, Atom2]
# The model will sample deviations from the RDKit equilibrium length.
flex_bond_lengths:
  # Isobutyl group (Tail)
  - [0, 1]
  - [1, 2]
  - [1, 3]
  # Linker to Ring
  - [3, 4]
  # Propionic acid group (Head)
  - [7, 10]
  - [10, 11]
  - [10, 12]
  - [12, 14] # C-O single bond

# Flexible Bond Angles: [Atom1, CentralAtom, Atom3]
flex_bond_angles:
  # Isobutyl head
  - [0, 1, 2]
  - [0, 1, 3]
  - [2, 1, 3]
  # Linker
  - [1, 3, 4]
  - [3, 4, 5]
  # Acid head
  - [7, 10, 11]
  - [7, 10, 12]
  - [10, 12, 14]

# ==========================================
# 3. SCALING FACTORS (Tuning the Physics)
# ==========================================
# Neural Net outputs are usually ~O(1). 
# We scale them down so we don't break the molecule.

length_scale: 0.01   # Previous: 0.1
angle_scale: 0.05    # Previous: 0.3

# ==========================================
# 4. GFLOWNET PARAMETERS
# ==========================================
id: conformer
policy_type: mlp 
# This must match main.yaml -> policy: heterogeneous

# Trajectory
length_traj: 5
reward_sampling_method: nested

# Distributions (Von Mises for Torsions)
n_comp: 5
vonmises_min_concentration: 4
fixed_distribution:
  vonmises_mean: 0.0
  vonmises_concentration: 0.5
random_distribution:
  vonmises_mean: 0.0
  vonmises_concentration: 2.0 #0.001

# Reward (Energy)
reward_func: boltzmann
reward_beta: 0.5 # prior: 32

# Buffer
buffer:
  data_path: null
  train: null
  test:
    type: random
    seed: 0
    n: 1000 # Reduced for faster debug
    output_csv: conformer_test.csv
    output_pkl: conformer_test.pkl
  replay_capacity: 1000