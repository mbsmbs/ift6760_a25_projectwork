defaults:
  - base

_target_: gflownet.envs.conformers.conformer.Conformer

# ==========================================
# 1. MOLECULE & STATE DEFINITION
# ==========================================
#smiles: 'CC(=O)Oc1ccccc1C(=O)O' # Asperin
# Active molecule: Ibuprofen
smiles: 'CC(C)Cc1ccc(cc1)[C@@H](C)C(=O)O'
n_torsion_angles: -1 # Alle Torsionen sind frei


flex_bond_lengths: null
flex_bond_angles: null

# ==========================================
# 2. GFLOWNET TRAJECTORY & EXPLORATION
# ==========================================
# Längere Trajektorie für den größeren Raum
length_traj: 64 
reward_sampling_method: nested

# Scaling (Sehr wichtig für Fully Flexible, um Kollisionen zu verhindern)
# Diese Werte müssen feinabgestimmt werden, um Atomkollisionen zu vermeiden.
length_scale: 0.005 # Sehr kleiner Schritt auf Bindungslängen
angle_scale: 0.03 # Kleiner Schritt auf Bindungswinkeln

# Distributions (Muss viel konzentrierter sein, da Aktionen mehr Schaden anrichten)
vonmises_min_concentration: 10.0 # Höhere Konzentration
fixed_distribution:
  vonmises_mean: 0.0
  vonmises_concentration: 10.0
random_distribution:
  vonmises_mean: 0.0
  vonmises_concentration: 20.0 # Noch höhere Konzentration als Torsion Only

# Reward (Boltzmann-Faktor)
reward_func: boltzmann
reward_beta: 8 

# Buffer
buffer:
  data_path: null
  train: null
  test:
    type: random
    seed: 0
    n: 1000 # Reduced for faster debug
    output_csv: conformer_test.csv
    output_pkl: conformer_test.pkl
  replay_capacity: 1000